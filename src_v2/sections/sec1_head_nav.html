  <style>
    :root {
      --bg-dark: #050b14;
      --bg-card: rgba(13, 21, 39, 0.90);
      --border-card: rgba(30, 41, 59, 0.85);
      --accent-cyan: #38bdf8;
      --accent-emerald: #10b981;
      --accent-amber: #f59e0b;
      --accent-rose: #f43f5e;
      --accent-indigo: #6366f1;
    }

    body {
      background-color: var(--bg-dark);
      color: #f1f5f9;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
    }

    code, .font-mono {
      font-family: 'JetBrains Mono', monospace !important;
    }

    .glass-card {
      background: var(--bg-card);
      backdrop-filter: blur(14px);
      border: 1px solid var(--border-card);
      transition: all 0.2s ease;
    }
    .glass-card:hover {
      border-color: rgba(56, 189, 248, 0.45);
      box-shadow: 0 10px 30px -5px rgba(2, 132, 199, 0.18);
    }

    .tab-btn {
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      white-space: nowrap;
      position: relative;
    }
    .tab-btn.active {
      background: linear-gradient(135deg, rgba(2, 132, 199, 0.28) 0%, rgba(99, 102, 241, 0.22) 100%);
      border-bottom: 2px solid #38bdf8;
      color: #38bdf8;
      font-weight: 700;
    }
    .tab-btn.active::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 8%;
      right: 8%;
      height: 2px;
      background: #38bdf8;
      box-shadow: 0 0 12px #38bdf8;
    }

    /* Custom scrollbars */
    ::-webkit-scrollbar { width: 7px; height: 7px; }
    ::-webkit-scrollbar-track { background: #080e1a; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #38bdf8; }

    /* Custom Range Sliders */
    input[type=range] {
      -webkit-appearance: none;
      background: #1e293b;
      height: 6px;
      border-radius: 3px;
      outline: none;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #38bdf8;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.7);
      transition: transform 0.1s ease;
    }
    input[type=range]::-webkit-slider-thumb:hover {
      transform: scale(1.15);
    }

    .katex-display {
      margin: 0.65em 0 !important;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 0.2em 0;
    }

    /* Tooltip styling */
    .part-tooltip {
      position: absolute;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid #38bdf8;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 11px;
      color: #f8fafc;
      pointer-events: none;
      z-index: 100;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      display: none;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col bg-slate-950 text-slate-100 antialiased selection:bg-cyan-500 selection:text-black">

      <!-- Live Telemetry Badges -->
      <div class="hidden xl:flex items-center space-x-3 text-xs font-mono">
        <div class="glass-card px-3 py-1.5 rounded-lg flex items-center space-x-2 border-slate-800">
          <span id="badgeMotorLed" class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>

        </div>
        <div class="glass-card px-3 py-1.5 rounded-lg flex items-center space-x-2 border-slate-800">
          <i class="fa-solid fa-arrows-spin text-cyan-400"></i>

  <!-- Main Workstation Container -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 space-y-6">
